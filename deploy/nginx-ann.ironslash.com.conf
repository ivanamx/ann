# Ann Atelier — ann.ironslash.com
# Ruta del proyecto: /home/ivanam/projects/ann
#
# En el servidor:
#   npm install && npm run build
#   pm2 start deploy/ecosystem.config.cjs
#   pm2 save
#   sudo cp deploy/nginx-ann.ironslash.com.conf /etc/nginx/sites-available/ann.ironslash.com
#   sudo ln -sf /etc/nginx/sites-available/ann.ironslash.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ann.ironslash.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ann.ironslash.com;

    ssl_certificate /etc/letsencrypt/live/ann.ironslash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ann.ironslash.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ivanam/projects/ann/dist;
    index index.html;

    access_log /var/log/nginx/ann.ironslash.com.access.log;
    error_log  /var/log/nginx/ann.ironslash.com.error.log;

    location ~* \.(js|css|webp|svg|ico|woff|woff2|jpg|jpeg|png|gif|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ann.ironslash.com;
    return 301 https://$host$request_uri;
}
