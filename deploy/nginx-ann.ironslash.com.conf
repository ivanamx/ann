# Ann Atelier — ann.ironslash.com
# Ruta del proyecto: /home/ivanam/projects/ann
#
# En el servidor:
#   npm install && npm run build
#   sudo cp deploy/nginx-ann.ironslash.com.conf /etc/nginx/sites-available/ann.ironslash.com
#   sudo ln -sf /etc/nginx/sites-available/ann.ironslash.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ann.ironslash.com

server {
    listen 80;
    listen [::]:80;
    server_name ann.ironslash.com;

    root /home/ivanam/projects/ann/dist;
    index index.html;

    access_log /var/log/nginx/ann.ironslash.com.access.log;
    error_log  /var/log/nginx/ann.ironslash.com.error.log;

    location ~* \.(js|css|webp|svg|ico|woff|woff2|jpg|jpeg|png|gif|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
